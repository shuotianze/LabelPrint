name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端检查（类型 / 单测 / 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 类型检查 + 打包
        run: npm run build
      - name: 单元测试
        run: npm test
      - name: 代码规范
        run: npm run lint

  rust:
    name: Rust 检查（格式 / 编译）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Tauri 在 Linux 上编译需要这些系统库
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - name: 格式检查
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
