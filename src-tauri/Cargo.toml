[package]
name = "label-app"
version = "0.1.0"
description = "跨平台标签打印机 App"
authors = ["shuofun"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "label_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-blec = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
